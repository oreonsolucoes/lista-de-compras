<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lista de Compras</title>
<meta name="description" content="Anote suas compras por departamento, risque no mercado e acompanhe os preços.">
<meta name="theme-color" content="#23703F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compras">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600..800;1,9..144,600..800&family=Nunito:wght@600;700;800&family=Quicksand:wght@500;600;700&display=swap">
<style>
/* Layout: app de três telas por hash sobre um jardim de bolhas em movimento — Início (painel), Planejar (anotação), Mercado (riscar e preçar), barra de caixa fixa */
:root{
  --bg:#FFF4F8; --bg2:#F6EEFF; --glass:rgba(255,255,255,.66); --glass-line:rgba(232,160,198,.38);
  --surface:#FFFFFF; --surface2:#FBE3EE; --ink:#4A2140; --muted:#9A6A8C; --line:rgba(226,160,196,.40);
  --accent:#E2558F; --accent2:#A861D8; --accent-ink:#FFFFFF; --accent-soft:#FDE2EE;
  --price:#9246C4; --price-soft:#F2E5FC; --danger:#D2445A; --danger-soft:#FCE3E8;
  --b1:#FFB3D1; --b2:#D9B8FF; --b3:#FFD3B8; --b4:#FFC2E8;
  --shadow:0 10px 30px -14px rgba(196,70,130,.45), 0 2px 6px -2px rgba(196,70,130,.12);
  --bar1:#E2558F; --bar2:#A861D8; --bar-ink:#FFFFFF;
  --f-display:"Fraunces", "Georgia", "Times New Roman", serif;
  --f-body:"Quicksand", "Nunito", "Segoe UI", system-ui, sans-serif;
  --f-num:"Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1D1020; --bg2:#170F24; --glass:rgba(52,28,56,.62); --glass-line:rgba(255,160,210,.20);
  --surface:#2A1830; --surface2:#3A2242; --ink:#FCE8F2; --muted:#D1A4C3; --line:rgba(255,170,215,.18);
  --accent:#FF7DB2; --accent2:#C18CFF; --accent-ink:#2A0E1F; --accent-soft:#4A2140;
  --price:#D7AEFF; --price-soft:#3A2552; --danger:#FF8A9A; --danger-soft:#4A1E2A;
  --b1:#8E2E63; --b2:#5A2E8E; --b3:#8E4A3A; --b4:#7A2A72;
  --shadow:0 12px 34px -14px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.3);
  --bar1:#C23F7C; --bar2:#7D45B8; --bar-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1D1020; --bg2:#170F24; --glass:rgba(52,28,56,.62); --glass-line:rgba(255,160,210,.20);
  --surface:#2A1830; --surface2:#3A2242; --ink:#FCE8F2; --muted:#D1A4C3; --line:rgba(255,170,215,.18);
  --accent:#FF7DB2; --accent2:#C18CFF; --accent-ink:#2A0E1F; --accent-soft:#4A2140;
  --price:#D7AEFF; --price-soft:#3A2552; --danger:#FF8A9A; --danger-soft:#4A1E2A;
  --b1:#8E2E63; --b2:#5A2E8E; --b3:#8E4A3A; --b4:#7A2A72;
  --shadow:0 12px 34px -14px rgba(0,0,0,.6), 0 2px 6px -2px rgba(0,0,0,.3);
  --bar1:#C23F7C; --bar2:#7D45B8; --bar-ink:#FFFFFF; color-scheme:dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 150px}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.lbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

.app{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:16px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--f-display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.sync{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="ok"] i{background:var(--accent)} .sync[data-s="err"] i{background:var(--danger)}

h1{font-family:var(--f-display);font-weight:800;font-size:clamp(1.6rem,5vw,2.2rem);line-height:1.05;margin:0;letter-spacing:-.02em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:700;font-size:.92rem;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:7px 11px;font-size:.84rem}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.warn{background:var(--danger);border-color:var(--danger);color:#fff}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* Início */
.hello{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.stat{padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat .v{font-family:var(--f-num);font-weight:600;font-size:1.45rem;font-variant-numeric:tabular-nums}
.sec{display:flex;flex-direction:column;gap:10px}
.sech{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.cc{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.cc-h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.cc-h h3{margin:0;font-size:1.08rem;overflow-wrap:anywhere}
.badge{font-size:.72rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.badge.go{background:var(--price-soft);color:var(--price)}
.badge.done{background:var(--accent-soft);color:var(--accent)}
.bar-p{height:6px;background:var(--surface2);border-radius:3px;overflow:hidden}
.bar-p i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .25s}
.cc-m{display:flex;justify-content:space-between;font-size:.9rem}
.cc-a{display:flex;gap:6px;flex-wrap:wrap}
.inline-confirm{background:var(--danger-soft);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
.inline-confirm div{display:flex;gap:6px;flex-wrap:wrap}
.newform{padding:16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end}
.newform .acts{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:11px 12px;font-size:1rem;width:100%;min-width:0}
.empty{border:1px dashed var(--line);border-radius:14px;padding:22px;color:var(--muted);display:flex;flex-direction:column;gap:6px;background:var(--surface)}
.empty strong{color:var(--ink);font-family:var(--f-display);font-size:1.1rem}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:12px 16px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow small{grid-column:1/-1;color:var(--muted);font-size:.8rem}

/* Busca e filtros */
.tools{display:flex;flex-direction:column;gap:10px}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;width:18px;height:18px;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:38px}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.82rem;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center}
.chip .num{font-size:.75rem;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .num{color:inherit;opacity:.75}
.chip.full .num{color:var(--accent)}

/* Cabeçalho de compra */
.back{font-size:.9rem;color:var(--muted);text-decoration:none;font-weight:700}
.chead{display:flex;flex-direction:column;gap:12px}
.ctitle{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tname{flex:1 1 220px;min-width:0;font-family:var(--f-display);font-weight:800;font-size:1.6rem;letter-spacing:-.02em;border:1px solid transparent;background:none;border-radius:10px;padding:4px 8px;margin-left:-8px}
.tname:hover,.tname:focus{border-color:var(--line);background:var(--surface)}
.tdate{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px}
.modes{display:flex;background:var(--surface2);border-radius:12px;padding:4px;gap:4px;align-self:flex-start}
.modes a{padding:8px 14px;border-radius:9px;text-decoration:none;font-weight:700;font-size:.9rem;color:var(--muted)}
.modes a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px color-mix(in srgb,var(--ink) 15%,transparent)}

/* Adicionar */
.add{padding:14px;display:flex;flex-direction:column;gap:10px}
.addrow{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:8px}
.addrow2{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.sel{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;font-size:.95rem;min-width:0;width:100%}
.ac{position:relative}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:8;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px color-mix(in srgb,var(--ink) 18%,transparent);overflow:hidden}
.sugg button{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:10px 12px;cursor:pointer}
.sugg button:first-child{border-top:0}
.sugg button:hover,.sugg button:focus{background:var(--surface2)}
.sugg small{color:var(--muted);font-size:.75rem}

/* Lista por departamento */
.groups{display:flex;flex-direction:column;gap:16px}
.dept{display:flex;flex-direction:column;gap:6px}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dh h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:.88rem;letter-spacing:.07em;color:var(--muted)}
.dh .num{font-size:.8rem;color:var(--muted)}
.dh .mini{flex:1;max-width:120px;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.dh .mini i{display:block;height:100%;background:var(--accent)}
.items{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.it{display:grid;align-items:center;gap:8px;padding:8px 8px 8px 4px;border-top:1px solid var(--line)}
.it:first-child{border-top:0}
.it.m{grid-template-columns:44px minmax(0,1fr) 58px 96px}
.it.p{grid-template-columns:minmax(0,1fr) 58px auto 34px;padding-left:14px}
.ck{width:42px;height:42px;border:0;background:none;cursor:pointer;display:grid;place-items:center;padding:0}
.ck span{width:26px;height:26px;border:2px solid var(--muted);border-radius:8px;display:grid;place-items:center;transition:background .15s,border-color .15s}
.it.ok .ck span{background:var(--accent);border-color:var(--accent)}
.it.ok .ck span::after{content:"";width:11px;height:6px;border-left:2.5px solid var(--accent-ink);border-bottom:2.5px solid var(--accent-ink);transform:translateY(-1px) rotate(-45deg)}
.nm{min-width:0;overflow-wrap:anywhere;display:flex;flex-direction:column;gap:2px}
.it.m .nm{cursor:pointer}
.nm b{font-weight:700}
.it.ok .nm b{text-decoration:line-through;text-decoration-thickness:2px;color:var(--muted);font-weight:400}
.nm small{font-size:.76rem;color:var(--muted)}
.up{color:var(--danger)} .down{color:var(--accent)}
.q{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 2px;font-family:var(--f-num);font-size:.9rem;width:100%;text-align:center}
.pr{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding-left:7px}
.pr em{font-style:normal;font-size:.75rem;color:var(--muted)}
.pr input{width:100%;min-width:0;border:0;background:none;padding:9px 7px 9px 3px;font-family:var(--f-num);font-variant-numeric:tabular-nums;text-align:right;font-size:.95rem}
.it.ok .pr{background:var(--price-soft);border-color:transparent}
.it.ok .pr input{color:var(--price);font-weight:600}
.est{font-family:var(--f-num);font-size:.85rem;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.del{width:32px;height:32px;border:0;background:none;cursor:pointer;color:var(--muted);border-radius:8px;font-size:1.15rem;line-height:1;padding:0}
.del.arm{background:var(--danger);color:#fff;font-size:.6rem;font-weight:700;width:34px}

/* Painel de progresso do mercado */
.hero{padding:16px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-num);font-size:1.2rem}
.hero .kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px}
.hero .kv div{display:flex;flex-direction:column;gap:2px}
.hero .kv .num{font-size:1.15rem;font-weight:600}
.banner{padding:14px 16px;border-radius:14px;background:var(--accent-soft);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}

/* Barra do caixa */
.cbar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.cbar .in{max-width:980px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.cbar .lbl{color:inherit;opacity:.7}
.cbar .tot{font-family:var(--f-num);font-weight:600;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1.1}
.cbar .btn{border-color:transparent}
.cbar .btn.pri{background:var(--accent);color:var(--accent-ink)}
.cbar .btn.alt{background:color-mix(in srgb,var(--bg) 15%,transparent);color:inherit}
.loading{padding:40px 0;color:var(--muted)}
.topr{display:flex;align-items:center;gap:10px}
.auth{max-width:400px;margin:40px auto 0;padding:24px;display:flex;flex-direction:column;gap:14px}
.auth p{margin:0;color:var(--muted)}
.err{background:var(--danger-soft);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:.9rem}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;cursor:pointer;padding:0;text-decoration:underline}
code{font-family:var(--f-num);font-size:.85em;background:var(--surface2);padding:1px 5px;border-radius:5px}
@media (max-width:460px){.hero{grid-template-columns:1fr;justify-items:start}.newform{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ================= Tema: jardim rosé ================= */
body{font-weight:500}
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden;background:linear-gradient(165deg,var(--bg) 0%,var(--bg2) 100%);pointer-events:none}
.bg .par{position:absolute;inset:-8%;transform:translate3d(var(--px,0px),var(--py,0px),0);transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.bg i{position:absolute;width:62vmax;height:62vmax;border-radius:50%;filter:blur(70px);opacity:.6}
.bg i:nth-child(1){background:radial-gradient(circle,var(--b1) 0%,transparent 62%);top:-22%;left:-18%;animation:d1 26s ease-in-out infinite alternate}
.bg i:nth-child(2){background:radial-gradient(circle,var(--b2) 0%,transparent 62%);top:-10%;right:-25%;animation:d2 31s ease-in-out infinite alternate}
.bg i:nth-child(3){background:radial-gradient(circle,var(--b3) 0%,transparent 62%);bottom:-28%;left:5%;animation:d3 28s ease-in-out infinite alternate}
.bg i:nth-child(4){background:radial-gradient(circle,var(--b4) 0%,transparent 62%);bottom:-20%;right:-12%;animation:d4 35s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(18vw,14vh) scale(1.15)}}
@keyframes d2{to{transform:translate(-16vw,20vh) scale(.9)}}
@keyframes d3{to{transform:translate(14vw,-18vh) scale(1.1)}}
@keyframes d4{to{transform:translate(-20vw,-12vh) scale(1.2)}}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#burst{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#burst svg{position:absolute;left:0;top:0;width:16px;height:16px;will-change:transform,opacity}

.top{border-bottom:0}
.brand{font-family:var(--f-display);font-style:italic;font-weight:700;font-size:1.4rem;letter-spacing:0;
  background:linear-gradient(100deg,var(--accent),var(--accent2),var(--accent));background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.brand svg{filter:drop-shadow(0 4px 10px rgba(226,85,143,.35));animation:bob 4s ease-in-out infinite}
@keyframes shine{to{background-position:200% center}}
@keyframes bob{50%{transform:translateY(-3px) rotate(-4deg)}}
h1{font-family:var(--f-display);font-weight:700;letter-spacing:-.01em}
.hello h1,.auth h1{background:linear-gradient(100deg,var(--ink) 20%,var(--accent) 70%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-family:var(--f-display);font-style:italic;font-weight:600;font-size:1.25rem}
.lbl{color:var(--accent);opacity:.85}

.card,.items,.empty,.sugg{background:var(--glass);-webkit-backdrop-filter:blur(16px) saturate(150%);backdrop-filter:blur(16px) saturate(150%);border:1px solid var(--glass-line);box-shadow:var(--shadow)}
.card,.items,.empty{border-radius:22px}
.empty{border-style:dashed}
.cc{transition:transform .35s cubic-bezier(.2,.8,.2,1),box-shadow .35s}
.cc:hover{transform:translateY(-4px) rotate(-.3deg);box-shadow:0 22px 40px -18px rgba(196,70,130,.55)}
.stat{transition:transform .3s}
.stat:hover{transform:translateY(-3px)}
.stat .v{font-family:var(--f-num);font-weight:800;color:var(--accent)}

.btn{border-radius:999px;border-color:var(--glass-line);background:var(--glass);transition:transform .2s cubic-bezier(.3,1.5,.5,1),box-shadow .25s,background .25s;font-family:var(--f-body)}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px -10px rgba(196,70,130,.6)}
.btn:active{transform:scale(.95)}
.btn.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;box-shadow:0 8px 20px -8px rgba(226,85,143,.7);position:relative;overflow:hidden;isolation:isolate}
.btn.pri::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);transform:translateX(-120%);transition:transform .7s}
.btn.pri:hover::after{transform:translateX(120%)}
.btn.ghost{background:none;border-color:transparent;box-shadow:none}
.btn.warn{background:linear-gradient(135deg,var(--danger),#E06A8A);border-color:transparent}
.btn[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.linkbtn{color:var(--accent)}

<script>
/* ---------- Efeitos: transições, crescimento de barras, corações, pétalas ---------- */
const FX={last:null,entering:true,G:{},R:{},T:{},
  reduce:matchMedia("(prefers-reduced-motion: reduce)").matches,
  pre(r){const k=r.v+(r.id||"");this.entering=k!==this.last;this.last=k}};
function grow(key,val){const prev=FX.G[key];FX.G[key]=val;const from=(FX.entering||prev===undefined)?0:prev;
  if(from===val||FX.reduce)return `<i style="width:${val}%"></i>`;
  FX.n=(FX.n||0)+1;return `<i class="grow g${FX.n%2}" style="--from:${from}%;--to:${val}%;width:${val}%"></i>`}
function ringArc(key,pct,R,C){const to=C*(1-pct/100);const prev=FX.R[key];FX.R[key]=to;const from=(FX.entering||prev===undefined)?C:prev;
  const a=from!==to&&!FX.reduce;
  FX.n=(FX.n||0)+1;return `<circle class="ringc${a?" anim a"+(FX.n%2):""}" cx="50" cy="50" r="${R}" fill="none" stroke="url(#rg)" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${to}" style="--from:${from};--to:${to}"/>`}
function bump(key,val){const prev=FX.T[key];FX.T[key]=val;return (!FX.entering&&prev!==undefined&&prev!==val)?" bump":""}
function fxAfterDraw(){if(!FX.entering)return;const v=document.getElementById("view"),b=document.getElementById("barSlot");
  [v,b].forEach(el=>{if(!el)return;el.classList.remove("enter");void el.offsetWidth;el.classList.add("enter")});
  clearTimeout(FX._t);FX._t=setTimeout(()=>{v&&v.classList.remove("enter");b&&b.classList.remove("enter")},1300)}

const HEART='<path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 2.7 4.6 6.4 4.1c2.2-.3 4 .9 5.6 2.9 1.6-2 3.4-3.2 5.6-2.9 3.7.5 5.5 4.4 4 7.7C19.5 16.4 12 21 12 21z"/>';
const SPARK='<path d="M12 1.5l2.3 7.2 7.2 2.3-7.2 2.3L12 20.5l-2.3-7.2L2.5 11l7.2-2.3z"/>';
function cor(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()||"#E2558F"}
function burst(x,y,n,spread){if(FX.reduce)return;const box=document.getElementById("burst");if(!box)return;
  const cs=[cor("--accent"),cor("--accent2"),cor("--b1"),"#FFFFFF",cor("--price")];
  for(let k=0;k<n;k++){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");
    s.innerHTML=Math.random()<.65?HEART:SPARK;s.style.fill=cs[k%cs.length];const sz=8+Math.random()*14;s.style.width=s.style.height=sz+"px";box.appendChild(s);
    const ang=Math.random()*Math.PI*2,dist=(spread||70)*(.4+Math.random()*.8);const dx=Math.cos(ang)*dist,dy=Math.sin(ang)*dist-30-Math.random()*30;
    const rot=(Math.random()-.5)*120;
    s.animate([{transform:`translate(${x-sz/2}px,${y-sz/2}px) scale(.2) rotate(0deg)`,opacity:1},
      {transform:`translate(${x+dx*.7-sz/2}px,${y+dy*.7-sz/2}px) scale(1.15) rotate(${rot*.6}deg)`,opacity:1,offset:.55},
      {transform:`translate(${x+dx-sz/2}px,${y+dy+40-sz/2}px) scale(.7) rotate(${rot}deg)`,opacity:0}],
      {duration:900+Math.random()*500,easing:"cubic-bezier(.2,.8,.3,1)"}).onfinish=()=>s.remove()}}
function chuva(){if(FX.reduce)return;const box=document.getElementById("burst");const W=innerWidth,H=innerHeight;
  const cs=[cor("--accent"),cor("--accent2"),cor("--b1"),cor("--b2"),"#FFFFFF"];
  for(let k=0;k<70;k++){const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 24 24");
    s.innerHTML=k%3?HEART:SPARK;s.style.fill=cs[k%cs.length];const sz=10+Math.random()*18;s.style.width=s.style.height=sz+"px";box.appendChild(s);
    const x=Math.random()*W,sway=(Math.random()-.5)*160,d=2200+Math.random()*1800;
    s.animate([{transform:`translate(${x}px,-30px) rotate(0deg)`,opacity:0},{opacity:1,offset:.1},
      {transform:`translate(${x+sway}px,${H+40}px) rotate(${(Math.random()-.5)*540}deg)`,opacity:.9}],
      {duration:d,delay:Math.random()*900,easing:"cubic-bezier(.3,.1,.5,1)",fill:"backwards"}).onfinish=()=>s.remove()}}
function celebra(id,ev,el){ui.just=id;clearTimeout(FX._j);FX._j=setTimeout(()=>{ui.just=null},900);
  let x=innerWidth/2,y=innerHeight/2;
  if(ev&&ev.clientX){x=ev.clientX;y=ev.clientY}else if(el&&el.getBoundingClientRect){const r=el.getBoundingClientRect();x=r.left+r.width/2;y=r.top+r.height/2}
  burst(x,y,14,80);
  const it=itens[id];if(it){const l=Object.values(itens).filter(i=>i.cid===it.cid);if(l.length&&l.every(i=>i.id===id||i.ok))setTimeout(chuva,350)}}

/* Pétalas e brilhos flutuando no fundo */
(function petalas(){const cv=document.getElementById("fx");if(!cv||FX.reduce)return;const g=cv.getContext("2d");
  let W,H,D,P=[],cs=[],tick=0,run=true;
  const pal=()=>{cs=[cor("--accent"),cor("--accent2"),cor("--b1"),cor("--b2"),cor("--b3")]};
  const size=()=>{D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*D;cv.height=H*D;g.setTransform(D,0,0,D,0,0);
    const n=Math.round(Math.min(34,Math.max(14,W*H/42000)));while(P.length<n)P.push(novo(true));P.length=n};
  const novo=(any)=>({x:Math.random()*W,y:any?Math.random()*H:H+20,r:4+Math.random()*9,vy:.15+Math.random()*.45,sw:Math.random()*Math.PI*2,
    sws:.004+Math.random()*.01,rot:Math.random()*6.28,vr:(Math.random()-.5)*.02,t:Math.random()<.45?0:Math.random()<.6?1:2,c:Math.floor(Math.random()*5),a:.25+Math.random()*.45});
  const heart=(r)=>{g.beginPath();g.moveTo(0,r*.35);g.bezierCurveTo(-r*1.1,-r*.4,-r*.4,-r*1.1,0,-r*.45);g.bezierCurveTo(r*.4,-r*1.1,r*1.1,-r*.4,0,r*.35);g.fill()};
  const petal=(r)=>{g.beginPath();g.ellipse(0,0,r*.55,r,0,0,Math.PI*2);g.fill()};
  const star=(r)=>{g.beginPath();for(let k=0;k<8;k++){const a=k*Math.PI/4,rr=k%2?r*.3:r;g.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}g.closePath();g.fill()};
  function frame(){if(!run)return;if(tick++%90===0)pal();g.clearRect(0,0,W,H);
    for(const p of P){p.y-=p.vy;p.sw+=p.sws;p.rot+=p.vr;const x=p.x+Math.sin(p.sw)*24;
      if(p.y<-20){Object.assign(p,novo(false))}
      g.save();g.translate(x,p.y);g.rotate(p.rot);g.globalAlpha=p.t===2?p.a*(.6+.4*Math.sin(p.sw*3)):p.a;g.fillStyle=cs[p.c];
      (p.t===0?heart:p.t===1?petal:star)(p.r);g.restore()}
    requestAnimationFrame(frame)}
  pal();size();addEventListener("resize",size);
  document.addEventListener("visibilitychange",()=>{run=!document.hidden;if(run)requestAnimationFrame(frame)});
  requestAnimationFrame(frame)})();

/* Fundo acompanha o dedo / mouse */
(function(){const par=document.getElementById("par");if(!par||FX.reduce)return;
  const mv=(x,y)=>{par.style.setProperty("--px",((x/innerWidth)-.5)*-40+"px");par.style.setProperty("--py",((y/innerHeight)-.5)*-40+"px")};
  addEventListener("pointermove",e=>mv(e.clientX,e.clientY),{passive:true})})();
</script>
<script>
const DEPTS=["HORTIFRUTI","AÇOUGUE","PADARIA","LIMPEZA","HIGIENE PESSOAL","MERCEARIA","CONGELADOS","FRIOS E LATICÍNIOS","BEBIDAS","UTENSÍLIOS","DOCES E BISCOITOS"];
const OUTROS="OUTROS";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const brl=n=>"R$ "+(n||0).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtIn=n=>n==null?"":n.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
const hoje=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const toDate=s=>{const [y,m,d]=(s||hoje()).split("-").map(Number);return new Date(y,m-1,d)};
const fmtData=s=>toDate(s).toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"2-digit"});
const mesNome=()=>new Date().toLocaleDateString("pt-BR",{month:"long"});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const ls={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function parsePreco(s){s=String(s).trim().replace(/R\$|\s/g,"");if(!s)return null;
  if(s.includes(","))s=s.replace(/\./g,"").replace(",",".");
  const n=parseFloat(s);return isFinite(n)&&n>=0?Math.round(n*100)/100:undefined}

let compras={}, itens={};
const ui={q:"",dept:null,hideOk:ls.get("lc_hide",false),aNome:"",aQtd:1,aDept:ls.get("lc_dept",""),sugg:false,confirm:null,newOpen:false,armed:null};
let ready=false;

/* ---------- Armazenamento: Firebase Realtime Database ---------- */
const CFG=window.FIREBASE_CONFIG||null;
const ESPACO=String(window.LISTA_ESPACO||"casa").replace(/[.#$\[\]\/]/g,"_");
let user=null, base=null, setupFalta=false, authMsg="", authModo="entrar", subs=[];
const S={
  sync(s,t){const el=$("#sync");el.dataset.s=s;el.querySelector("span").textContent=t},
  write(col,id,op,data){
    const T=col==="compras"?compras:itens;
    if(op==="set")T[id]={id,...data};else if(op==="update"){if(T[id])Object.assign(T[id],data)}else delete T[id];
    render();
    if(!base)return;
    const ref=base.child(col).child(id);
    const clean=data?JSON.parse(JSON.stringify(data,(k,v)=>v===undefined?null:v)):null;
    (op==="set"?ref.set(clean):op==="update"?ref.update(clean):ref.remove()).catch(e=>{
      S.sync("err",/permission/i.test(e&&(e.code||e.message)||"")?"Sem permissão: confira as regras do banco":"Não foi possível salvar uma alteração");
    });
  }
};
function desliga(){subs.forEach(f=>f());subs=[];base=null}
function liga(u){
  desliga();ready=false;render();
  base=firebase.database().ref("listaCompras/"+ESPACO);
  const got={c:false,i:false};
  const pronto=()=>{if(got.c&&got.i){ready=true;render()}};
  const onErr=e=>{S.sync("err",/permission/i.test(e&&(e.code||e.message)||"")?"Sem permissão: confira as regras do banco":"Erro ao ler os dados");ready=true;render()};
  const rc=base.child("compras"),ri=base.child("itens");
  const fc=s=>{const o={};s.forEach(c=>{o[c.key]={id:c.key,...c.val()}});compras=o;got.c=true;pronto()};
  const fi=s=>{const o={};s.forEach(c=>{o[c.key]={id:c.key,...c.val()}});itens=o;got.i=true;pronto()};
  rc.on("value",fc,onErr);ri.on("value",fi,onErr);
  subs.push(()=>rc.off("value",fc),()=>ri.off("value",fi));
}
function traduz(e){const c=(e&&e.code)||"";
  return ({"auth/invalid-email":"E-mail inválido.","auth/missing-password":"Digite a senha.","auth/invalid-credential":"E-mail ou senha incorretos.",
    "auth/wrong-password":"E-mail ou senha incorretos.","auth/user-not-found":"E-mail ou senha incorretos.","auth/email-already-in-use":"Este e-mail já tem conta. Use “Entrar”.",
    "auth/weak-password":"A senha precisa de pelo menos 6 caracteres.","auth/too-many-requests":"Muitas tentativas. Aguarde alguns minutos.",
    "auth/network-request-failed":"Sem internet. Tente de novo.","auth/operation-not-allowed":"Ative o login por e-mail/senha no Firebase (Authentication › Sign-in method)."})[c]||"Não foi possível entrar ("+(c||"erro")+")."}

(function boot(){
  if(!CFG||!CFG.apiKey||/COLE|SUA_/i.test(CFG.apiKey)||typeof firebase==="undefined"){setupFalta=true;ready=true;S.sync("err","Firebase não configurado");render();return}
  firebase.initializeApp(CFG);
  firebase.database().ref(".info/connected").on("value",s=>{if(!user)return;S.sync(s.val()?"ok":"err",s.val()?"Sincronizado":"Sem conexão — salva quando voltar")});
  firebase.auth().onAuthStateChanged(u=>{
    user=u;$("#sair").hidden=!u;
    if(u){S.sync("wait","Carregando…");liga(u)}
    else{desliga();compras={};itens={};ready=true;S.sync("wait","Entre para sincronizar");render()}
  });
})();

/* ---------- Dados derivados ---------- */
const itensDe=cid=>Object.values(itens).filter(i=>i.cid===cid);
function st(cid){const l=itensDe(cid);let ok=0,total=0,est=0,falta=0;
  l.forEach(i=>{const q=i.qtd||1;const p=i.preco!=null?i.preco:lastPrice(norm(i.nome),cid);
    if(i.ok){ok++;total+=(i.preco||0)*q}else if(p!=null)falta+=p*q; if(p!=null)est+=p*q});
  return {n:l.length,ok,total,est,falta,pct:l.length?Math.round(ok/l.length*100):0}}
let IDX=new Map();
function buildIndex(){IDX=new Map();
  Object.values(itens).forEach(i=>{const k=norm(i.nome);const c=compras[i.cid];if(!k||!c)return;
    let e=IDX.get(k);if(!e){e={nome:i.nome,depto:i.depto,precos:[],cids:new Set(),ult:""};IDX.set(k,e)}
    e.cids.add(i.cid);const d=c.data||"";if(d>=e.ult){e.ult=d;e.nome=i.nome;e.depto=i.depto}
    if(i.preco!=null)e.precos.push({p:i.preco,d,cid:i.cid,t:i.t||0})});
  IDX.forEach(e=>e.precos.sort((a,b)=>b.d.localeCompare(a.d)||b.t-a.t))}
function lastPrice(k,cid){const e=IDX.get(k);if(!e)return null;
  const cd=(compras[cid]||{}).data||"9999";
  const x=e.precos.find(p=>p.cid!==cid&&p.d<=cd)||e.precos.find(p=>p.cid!==cid);return x?x.p:null}

/* ---------- Roteador ---------- */
function route(){const m=location.hash.slice(1).match(/^(planejar|mercado)-([a-z0-9]+)$/);return m?{v:m[1],id:m[2]}:{v:"inicio"}}
window.addEventListener("hashchange",()=>{ui.q="";ui.dept=null;ui.confirm=null;ui.sugg=false;ui.armed=null;render();window.scrollTo(0,0)});

let pend=false;

/* ---------- Atualização sem recriar o que já está na tela ----------
   Compara o HTML novo com o que já existe e só altera o que mudou.
   O campo em que a pessoa está digitando nunca é recriado nem tem o valor trocado,
   então o teclado, o corretor e a seleção do texto não são interrompidos. */
let composing=false, renderAfterCompose=false;
document.addEventListener("compositionstart",()=>{composing=true});
document.addEventListener("compositionend",()=>{composing=false;if(renderAfterCompose){renderAfterCompose=false;render()}});
function isTyping(el){return el===document.activeElement&&(el.tagName==="INPUT"||el.tagName==="TEXTAREA")}
function nodeKey(n){return n.nodeType===1?(n.id||n.getAttribute("data-k")||null):null}
function sameKind(a,b){return a.nodeType===b.nodeType&&(a.nodeType!==1||(a.tagName===b.tagName&&a.namespaceURI===b.namespaceURI))}
function morphNode(from,to){
  if(from.nodeType!==1){if(from.nodeValue!==to.nodeValue)from.nodeValue=to.nodeValue;return}
  const typing=isTyping(from);
  for(let i=from.attributes.length-1;i>=0;i--){const n=from.attributes[i].name;if(!to.hasAttribute(n)&&!(typing&&n==="value"))from.removeAttribute(n)}
  for(const a of to.attributes){if(typing&&a.name==="value")continue;if(from.getAttribute(a.name)!==a.value)from.setAttribute(a.name,a.value)}
  if(from.tagName==="INPUT"){if(!typing){const v=to.getAttribute("value")||"";if(from.type!=="checkbox"&&from.value!==v)from.value=v}return}
  if(from.tagName==="TEXTAREA"){if(!typing&&from.value!==to.value)from.value=to.value;return}
  morphChildren(from,to);
  if(from.tagName==="SELECT"&&from!==document.activeElement){const sel=to.querySelector("option[selected]");const v=sel?sel.value:(to.options&&to.options[0]?to.options[0].value:"");if(from.value!==v)from.value=v}
}
function morphChildren(from,to){
  const olds=[...from.childNodes],keyed=new Map();
  olds.forEach(n=>{const k=nodeKey(n);if(k)keyed.set(k,n)});
  const used=new Set();let oi=0,ref=from.firstChild;
  for(const nn of [...to.childNodes]){
    const k=nodeKey(nn);let m=null;
    if(k){const c=keyed.get(k);if(c&&!used.has(c)&&sameKind(c,nn))m=c}
    else{while(oi<olds.length&&(used.has(olds[oi])||nodeKey(olds[oi])))oi++;if(oi<olds.length&&sameKind(olds[oi],nn)){m=olds[oi];oi++}}
    if(m){used.add(m);if(m===ref)ref=ref.nextSibling;else from.insertBefore(m,ref);morphNode(m,nn)}
    else from.insertBefore(nn,ref);
  }
  olds.forEach(n=>{if(!used.has(n)&&n.parentNode===from&&!(n.nodeType===1&&n.contains(document.activeElement)&&isTyping(document.activeElement)))from.removeChild(n)});
}
function patch(el,html){
  const a=document.activeElement,st=a&&isTyping(a)&&el.contains(a)?{v:a.value,s:a.selectionStart,e:a.selectionEnd}:null;
  const t=document.createElement("template");t.innerHTML=html;morphChildren(el,t.content);
  if(st&&a.isConnected){if(a.value!==st.v)a.value=st.v;if(document.activeElement!==a){a.focus({preventScroll:true});try{a.setSelectionRange(st.s,st.e)}catch(e){}}}
}
function render(){if(composing){renderAfterCompose=true;return}if(pend)return;pend=true;requestAnimationFrame(()=>{pend=false;if(composing){renderAfterCompose=true;return}draw()})}
function draw(){
  if(setupFalta){$("#view").innerHTML=vSetup();$("#barSlot").innerHTML="";return}
  if(!ready){$("#view").innerHTML=`<p class="loading">Carregando suas compras…</p>`;$("#barSlot").innerHTML="";return}
  if(!user){$("#view").innerHTML=vLogin();$("#barSlot").innerHTML="";return}
  buildIndex();
  const fa=document.activeElement;let keep=null;
  if(fa&&fa.id&&$("#view").contains(fa)&&(fa.tagName==="INPUT"))keep={id:fa.id,v:fa.value,s:fa.selectionStart,e:fa.selectionEnd};
  const r=route();FX.pre(r);let html="",bar="";
  if(r.v!=="inicio"&&!compras[r.id]){html=`<div class="empty" style="margin-top:20px"><strong>Compra não encontrada</strong><span>Ela pode ter sido apagada.</span><a class="btn" href="#inicio" style="align-self:flex-start">Voltar para as compras</a></div>`}
  else if(r.v==="planejar"){[html,bar]=vPlanejar(compras[r.id])}
  else if(r.v==="mercado"){[html,bar]=vMercado(compras[r.id])}
  else html=vInicio();
  if(FX.entering){$("#view").innerHTML=html;$("#barSlot").innerHTML=bar}else{patch($("#view"),html);patch($("#barSlot"),bar)}
  fxAfterDraw();
  if(keep&&FX.entering){const el=document.getElementById(keep.id);if(el){el.value=keep.v;el.focus({preventScroll:true});try{el.setSelectionRange(keep.s,keep.e)}catch(e){}}}
}

/* ---------- Componentes ---------- */
const icSearch=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>`;
function searchBox(ph){return `<div class="search">${icSearch}<input class="inp" id="busca" type="search" placeholder="${ph}" value="${esc(ui.q)}" aria-label="${ph}"></div>`}
function chipsBar(list){
  const by={};list.forEach(i=>{const d=i.depto||OUTROS;(by[d]||(by[d]={n:0,ok:0})).n++;if(i.ok)by[d].ok++});
  const ds=[...DEPTS,OUTROS,...Object.keys(by).filter(k=>![...DEPTS,OUTROS].includes(k))].filter(d=>by[d]);
  return `<div class="chips" role="group" aria-label="Filtrar por departamento">
    <button class="chip" data-act="dept" data-d="" aria-pressed="${!ui.dept}">Todos <span class="num">${list.filter(i=>i.ok).length}/${list.length}</span></button>
    ${ds.map(d=>`<button class="chip${by[d].ok===by[d].n?" full":""}" data-act="dept" data-d="${esc(d)}" aria-pressed="${ui.dept===d}">${esc(d)} <span class="num">${by[d].ok}/${by[d].n}</span></button>`).join("")}</div>`}
function filtra(list,hide){const q=norm(ui.q);
  return list.filter(i=>(!q||norm(i.nome).includes(q))&&(!ui.dept||(i.depto||OUTROS)===ui.dept)&&!(hide&&i.ok))}
function grupos(list,rowFn,sortFn){
  const g={};list.forEach(i=>{(g[i.depto||OUTROS]||(g[i.depto||OUTROS]=[])).push(i)});
  const order=[...DEPTS,OUTROS,...Object.keys(g).filter(k=>![...DEPTS,OUTROS].includes(k))];
  return `<div class="groups">${order.filter(d=>g[d]).map(d=>{const l=g[d].sort(sortFn);const ok=l.filter(i=>i.ok).length;
    return `<section class="dept" data-k="d-${esc(d)}"><div class="dh"><h3>${esc(d)}</h3><span class="mini">${grow("d"+d,Math.round(ok/l.length*100))}</span><span class="num">${ok}/${l.length}</span></div>
    <div class="items">${l.map(rowFn).join("")}</div></section>`}).join("")}</div>`}
function modes(c,cur){return `<nav class="modes" aria-label="Modo"><a href="#planejar-${c.id}" ${cur==="p"?'aria-current="page"':""}>Planejar</a><a href="#mercado-${c.id}" ${cur==="m"?'aria-current="page"':""}>No mercado</a></nav>`}
function chead(c,cur){return `<div class="chead"><a class="back" href="#inicio">← Todas as compras</a>
  <div class="ctitle"><input class="tname" id="cNome" value="${esc(c.nome)}" aria-label="Nome da compra" maxlength="60"><input class="tdate" type="date" id="cData" value="${esc(c.data||hoje())}" aria-label="Data da compra"></div>
  ${modes(c,cur)}</div>`}
function trendHTML(i){const lp=lastPrice(norm(i.nome),i.cid);if(lp==null)return "";
  if(i.preco==null)return `<small>Última vez: <span class="num">${brl(lp)}</span></small>`;
  const d=Math.round((i.preco-lp)*100)/100;
  if(d===0)return `<small>Mesmo preço da última vez</small>`;
  return `<small class="${d>0?"up":"down"}">${d>0?"▲":"▼"} <span class="num">${brl(Math.abs(d))}</span> vs. última (${brl(lp)})</small>`}
function qtySel(i){let o="";const m=Math.max(20,i.qtd||1);for(let n=1;n<=m;n++)o+=`<option value="${n}"${n===(i.qtd||1)?" selected":""}>${n}×</option>`;
  return `<select class="q" data-f="qtd" data-id="${i.id}" aria-label="Quantidade de ${esc(i.nome)}">${o}</select>`}

/* ---------- Telas: configuração e login ---------- */

  <p>Abra o arquivo <code>firebase-config.js</code> no repositório e cole a configuração do seu app web do Firebase (Configurações do projeto › Seus apps).</p>
  <p>Depois ative <b>Authentication › E-mail/senha</b> e crie o <b>Realtime Database</b> com as regras de <code>database.rules.json</code>.</p></div>`}

  return `<form class="card auth" id="fLogin" autocomplete="on"><div><span class="lbl">${cria?"Nova conta":"Bem-vindo de volta"}</span><h1>${cria?"Criar conta":"Entrar"}</h1></div>

  <label class="field"><span class="lbl">E-mail</span><input class="inp" id="lEmail" type="email" autocomplete="email" required></label>
  <label class="field"><span class="lbl">Senha</span><input class="inp" id="lSenha" type="password" autocomplete="${cria?"new-password":"current-password"}" minlength="6" required></label>

  <p>${cria?"Já tem conta?":"Primeira vez aqui?"} <button type="button" class="linkbtn" data-act="authmodo">${cria?"Entrar":"Criar conta"}</button></p></form>`}

/* ---------- Tela: Início ---------- */
function vInicio(){
  const cs=Object.values(compras).sort((a,b)=>(b.data||"").localeCompare(a.data||"")||(b.criado||0)-(a.criado||0));
  const abertas=cs.filter(c=>!c.concluida),feitas=cs.filter(c=>c.concluida);
  const mes=hoje().slice(0,7);
  const gasto=cs.filter(c=>(c.data||"").startsWith(mes)).reduce((a,c)=>a+st(c.id).total,0);
  const nMes=cs.filter(c=>(c.data||"").startsWith(mes)&&st(c.id).total>0).length;
  const card=c=>{const s=st(c.id);const badge=c.concluida?'<span class="badge done">Concluída</span>':s.ok?'<span class="badge go">No mercado</span>':'<span class="badge">Planejando</span>';
    return `<article class="card cc" data-k="c-${c.id}"><div class="cc-h"><div><h3>${esc(c.nome)}</h3><span class="muted">${fmtData(c.data)}</span></div>${badge}</div>
      <div class="bar-p" role="progressbar" aria-valuenow="${s.pct}" aria-valuemin="0" aria-valuemax="100">${grow("c"+c.id,s.pct)}</div>
      <div class="cc-m"><span>${s.ok}/${s.n} itens · ${s.pct}%</span><span class="num">${s.total>0?brl(s.total):s.est>0?"≈ "+brl(s.est):"—"}</span></div>
      <div class="cc-a"><a class="btn sm" href="#planejar-${c.id}">Planejar</a><a class="btn sm pri" href="#mercado-${c.id}">${c.concluida?"Ver compra":"Ir ao mercado"}</a>
      <button class="btn sm ghost" data-act="dup" data-id="${c.id}">Repetir</button><button class="btn sm ghost" data-act="askdel" data-id="${c.id}">Apagar</button></div>
      ${ui.confirm===c.id?`<div class="inline-confirm"><span>Apagar “${esc(c.nome)}” e seus ${s.n} itens?</span><div><button class="btn sm warn" data-act="del" data-id="${c.id}">Apagar compra</button><button class="btn sm" data-act="cancel">Cancelar</button></div></div>`:""}
    </article>`};
  const q=norm(ui.q);
  const hist=q?[...IDX.values()].filter(e=>norm(e.nome).includes(q)).sort((a,b)=>b.ult.localeCompare(a.ult)).slice(0,12):[];
  return `<div class="app" style="padding-top:20px">
  <div class="hello"><div><span class="lbl">Suas compras</span><h1>${abertas.length?`${abertas.length} ${abertas.length>1?"compras abertas":"compra aberta"}`:"Tudo em dia"}</h1></div>
    <button class="btn pri" data-act="newopen">+ Nova compra</button></div>
  ${ui.newOpen?`<form class="card newform" id="fNova"><label class="field"><span class="lbl">Nome</span><input class="inp" id="nNome" placeholder="Ex.: Compra da semana" maxlength="60"></label>
    <label class="field"><span class="lbl">Data</span><input class="inp" type="date" id="nData" value="${hoje()}"></label>
    <div class="acts"><button type="button" class="btn ghost" data-act="newcancel">Cancelar</button><button class="btn pri" type="submit">Criar e anotar itens</button></div></form>`:""}
  <div class="stats">
    <div class="card stat"><span class="lbl">Gasto em ${mesNome()}</span><span class="v">${brl(gasto)}</span></div>
    <div class="card stat"><span class="lbl">Compras no mês</span><span class="v">${nMes}</span></div>
    <div class="card stat"><span class="lbl">Produtos no histórico</span><span class="v">${IDX.size}</span></div>
  </div>
  <section class="sec">${searchBox("Buscar produto no histórico de preços")}
    ${q?(hist.length?`<div class="card hist">${hist.map(e=>{const ps=e.precos.map(p=>p.p);const mn=Math.min(...ps),mx=Math.max(...ps);
      return `<div class="hrow"><b>${esc(e.nome)}</b><span class="num">${ps.length?brl(e.precos[0].p):"sem preço"}</span>
      <small>${esc(e.depto||OUTROS)} · em ${e.cids.size} compra${e.cids.size>1?"s":""}${ps.length>1?` · menor ${brl(mn)} · maior ${brl(mx)}`:""}${e.ult?` · última em ${fmtData(e.ult)}`:""}</small></div>`}).join("")}</div>`
      :`<div class="empty"><span>Nenhum produto com “${esc(ui.q)}” nas suas compras.</span></div>`):""}
  </section>
  <section class="sec"><div class="sech"><h2>Em andamento</h2><span class="muted num">${abertas.length}</span></div>
    ${abertas.length?`<div class="grid">${abertas.map(card).join("")}</div>`:`<div class="empty"><strong>Nenhuma compra aberta</strong><span>Crie uma compra para a semana ou para o dia, anote os itens por departamento e use o modo “No mercado” para riscar e preçar.</span></div>`}
  </section>
  ${feitas.length?`<section class="sec"><div class="sech"><h2>Concluídas</h2><span class="muted num">${feitas.length}</span></div><div class="grid">${feitas.map(card).join("")}</div></section>`:""}
  </div>`}

/* ---------- Tela: Planejar ---------- */
function vPlanejar(c){
  const all=itensDe(c.id);const s=st(c.id);
  const q=norm(ui.aNome);const inList=new Set(all.filter(i=>!i.ok).map(i=>norm(i.nome)));
  const sug=ui.sugg&&q?[...IDX.entries()].filter(([k])=>k.includes(q)&&!inList.has(k)).sort((a,b)=>b[1].cids.size-a[1].cids.size).slice(0,6):[];
  const opts=`<option value="">Departamento…</option>`+DEPTS.map(d=>`<option${ui.aDept===d?" selected":""}>${d}</option>`).join("")+`<option${ui.aDept===OUTROS?" selected":""}>${OUTROS}</option>`;
  let qo="";for(let n=1;n<=10;n++)qo+=`<option value="${n}"${n===ui.aQtd?" selected":""}>${n}×</option>`;
  const vis=filtra(all,false);
  const row=i=>{const lp=i.preco!=null?i.preco:lastPrice(norm(i.nome),c.id);
    return `<div class="it p${i.ok?" ok":""}" data-k="r-${i.id}"><div class="nm"><b>${esc(i.nome)}</b>${i.ok?'<small>Já no carrinho</small>':""}</div>${qtySel(i)}
    <span class="est">${lp!=null?"≈ "+brl(lp*(i.qtd||1)):"—"}</span>
    <button class="del${ui.armed===i.id?" arm":""}" data-act="rm" data-id="${i.id}" aria-label="Remover ${esc(i.nome)}">${ui.armed===i.id?"APAGAR":"×"}</button></div>`};
  const html=`<div class="app" style="padding-top:18px">${chead(c,"p")}
  <form class="card add" id="fAdd" autocomplete="off">
    <div class="addrow"><div class="ac"><input class="inp" id="aNome" placeholder="Item a ser adicionado" aria-label="Item a ser adicionado" maxlength="60" value="${esc(ui.aNome)}">
      ${sug.length?`<div class="sugg">${sug.map(([k,e])=>`<button type="button" data-act="sug" data-k="${esc(k)}"><b>${esc(e.nome)}</b><span class="num muted">${e.precos.length?brl(e.precos[0].p):""}</span><small>${esc(e.depto||OUTROS)} · ${e.cids.size}× comprado</small></button>`).join("")}</div>`:""}</div>
      <select class="sel" id="aQtd" aria-label="Quantidade">${qo}</select></div>
    <div class="addrow2"><select class="sel" id="aDept" aria-label="Departamento">${opts}</select><button class="btn pri" type="submit">Adicionar</button></div>
  </form>
  ${all.length?`<div class="tools">${searchBox("Buscar nesta lista")}${chipsBar(all)}</div>
    ${vis.length?grupos(vis,row,(a,b)=>(a.t||0)-(b.t||0)):`<div class="empty"><span>Nenhum item encontrado com esse filtro.</span></div>`}`
  :`<div class="empty"><strong>Lista vazia</strong><span>Digite um item acima. Produtos que você já comprou antes aparecem como sugestão, com o departamento e o último preço pago.</span></div>`}
  </div>`;
  const bar=`<div class="cbar"><div class="in"><div><div class="lbl">${s.n} itens · estimado</div><div class="tot">${s.est>0?brl(s.est):"—"}</div></div><a class="btn pri" href="#mercado-${c.id}">Ir ao mercado →</a></div></div>`;
  return [html,bar]}

/* ---------- Tela: Mercado ---------- */

  const all=itensDe(c.id);const s=st(c.id);
  const R=40,C=2*Math.PI*R;
  const vis=filtra(all,ui.hideOk);
  const row=i=>`<div class="it m${i.ok?" ok":""}${ui.just===i.id?" pop":""}" data-k="r-${i.id}">

    <div class="nm" data-act="tg" data-id="${i.id}"><b>${esc(i.nome)}</b>${i.preco!=null&&(i.qtd||1)>1?`<small class="num">${i.qtd} × ${brl(i.preco)} = ${brl(i.preco*i.qtd)}</small>`:""}${trendHTML(i)}</div>
    ${qtySel(i)}

  const html=`<div class="app" style="padding-top:18px">${chead(c,"m")}
  ${c.concluida?`<div class="banner"><span><b>Compra concluída</b> · ${s.ok} itens · <span class="num">${brl(s.total)}</span></span><button class="btn sm" data-act="reabrir">Reabrir</button></div>`
   :(s.n&&s.ok===s.n?`<div class="banner"><span><b>Tudo no carrinho!</b> Finalize para guardar no histórico.</span><button class="btn sm pri" data-act="fim">Finalizar compra</button></div>`:"")}
  ${all.length?`<div class="card hero">
    <div class="ring"><svg viewBox="0 0 100 100"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--accent)"/><stop offset="1" style="stop-color:var(--accent2)"/></linearGradient></defs><circle cx="50" cy="50" r="${R}" fill="none" stroke="var(--surface2)" stroke-width="11"/>${ringArc(c.id,s.pct,R,C)}</svg><b>${s.pct}%</b></div>
    <div class="kv"><div><span class="lbl">Itens</span><span class="num">${s.ok} de ${s.n}</span></div>
      <div><span class="lbl">No carrinho</span><span class="num">${brl(s.total)}</span></div>
      <div><span class="lbl">Falta (estimado)</span><span class="num">${s.falta>0?"≈ "+brl(s.falta):"—"}</span></div></div></div>
  <div class="tools">${searchBox("Buscar item na lista")}
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn sm" data-act="hide" aria-pressed="${ui.hideOk}">Esconder riscados</button></div>
    ${chipsBar(all)}</div>
  ${vis.length?grupos(vis,row,(a,b)=>(!!a.ok-!!b.ok)||(a.t||0)-(b.t||0)):`<div class="empty"><span>${ui.hideOk&&filtra(all,false).length?"Tudo deste filtro já está no carrinho.":"Nenhum item encontrado com esse filtro."}</span></div>`}`
  :`<div class="empty"><strong>Esta compra ainda não tem itens</strong><span>Anote o que precisa comprar na aba Planejar.</span><a class="btn pri" href="#planejar-${c.id}" style="align-self:flex-start">Planejar itens</a></div>`}
  </div>`;
  const bar=`<div class="cbar"><div class="in"><div><div class="lbl">No carrinho · ${s.ok}/${s.n}</div><div class="tot${bump("t"+c.id,s.total)}">${brl(s.total)}</div></div>
    ${c.concluida?`<button class="btn alt" data-act="reabrir">Reabrir</button>`:`<button class="btn pri" data-act="fim"${s.ok?"":" disabled"}>Finalizar</button>`}</div></div>`;
  return [html,bar]}

/* ---------- Ações ---------- */
function addItem(cid,nome,qtd,depto){
  const k=norm(nome);const e=IDX.get(k);const d=depto||(e&&e.depto)||OUTROS;
  const dup=itensDe(cid).find(i=>!i.ok&&norm(i.nome)===k);
  if(dup){S.write("itens",dup.id,"update",{qtd:Math.min(99,(dup.qtd||1)+qtd)});return}
  const id=uid();S.write("itens",id,"set",{cid,nome,qtd,depto:d,preco:null,ok:false,t:Date.now()})}

document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b)return;const a=b.dataset.act,id=b.dataset.id;const r=route();
  if(a!=="rm"&&ui.armed){ui.armed=null}
  switch(a){
    case "sair":firebase.auth().signOut();location.hash="inicio";break;
    case "authmodo":authModo=authModo==="criar"?"entrar":"criar";authMsg="";render();break;
    case "newopen":ui.newOpen=true;render();setTimeout(()=>{const n=$("#nNome");n&&n.focus()},40);break;
    case "newcancel":ui.newOpen=false;render();break;
    case "askdel":ui.confirm=id;render();break;
    case "cancel":ui.confirm=null;render();break;
    case "del":itensDe(id).forEach(i=>S.write("itens",i.id,"delete"));S.write("compras",id,"delete");ui.confirm=null;break;
    case "dup":{const c=compras[id];const nid=uid();S.write("compras",nid,"set",{nome:c.nome,data:hoje(),criado:Date.now()});
      itensDe(id).forEach((i,n)=>S.write("itens",uid(),"set",{cid:nid,nome:i.nome,qtd:i.qtd||1,depto:i.depto||OUTROS,preco:null,ok:false,t:Date.now()+n}));
      location.hash="planejar-"+nid;break}
    case "dept":ui.dept=b.dataset.d||null;render();break;
    case "hide":ui.hideOk=!ui.hideOk;ls.set("lc_hide",ui.hideOk);render();break;
    case "tg":{const i=itens[id];if(i){if(!i.ok)celebra(id,e);S.write("itens",id,"update",{ok:!i.ok})}break}
    case "rm":if(ui.armed===id){ui.armed=null;S.write("itens",id,"delete")}else{ui.armed=id;render();clearTimeout(window._arm);window._arm=setTimeout(()=>{ui.armed=null;render()},3000)}break;
    case "sug":{const e2=IDX.get(b.dataset.k);if(e2){ui.aNome=e2.nome;ui.aDept=e2.depto||"";ui.sugg=false;render();setTimeout(()=>{const n=$("#aNome");n&&n.focus()},30)}break}
    case "fim":if(r.id){S.write("compras",r.id,"update",{concluida:true,concluidaEm:Date.now()});window.scrollTo({top:0,behavior:"smooth"});chuva()}break;
    case "reabrir":if(r.id)S.write("compras",r.id,"update",{concluida:false});break;
  }
});
document.addEventListener("input",e=>{const t=e.target;
  if(t.id==="busca"){ui.q=t.value;if(!e.isComposing)render()}
  else if(t.id==="aNome"){ui.aNome=t.value;ui.sugg=true;if(!e.isComposing)render()}
});
document.addEventListener("change",e=>{const t=e.target;const r=route();
  if(t.dataset.f==="qtd")S.write("itens",t.dataset.id,"update",{qtd:+t.value});
  else if(t.dataset.f==="preco"){const i=itens[t.dataset.id];if(!i)return;const v=parsePreco(t.value);
    if(v===undefined){t.value=fmtIn(i.preco);return}
    const f={};if(v!==i.preco)f.preco=v;if(v!=null&&!i.ok){f.ok=true;celebra(i.id,null,t)}
    if(Object.keys(f).length)S.write("itens",i.id,"update",f);else t.value=fmtIn(i.preco)}
  else if(t.id==="cNome"&&r.id){const v=t.value.trim();if(v&&v!==compras[r.id].nome)S.write("compras",r.id,"update",{nome:v});else t.value=compras[r.id].nome}
  else if(t.id==="cData"&&r.id&&t.value)S.write("compras",r.id,"update",{data:t.value});
  else if(t.id==="aQtd")ui.aQtd=+t.value;
  else if(t.id==="aDept"){ui.aDept=t.value;ls.set("lc_dept",t.value)}
});
document.addEventListener("keydown",e=>{const t=e.target;
  if(e.key==="Enter"&&(t.dataset.f==="preco"||t.id==="cNome")){e.preventDefault();t.blur()}
  if(e.key==="Escape"&&ui.sugg){ui.sugg=false;render()}
});
document.addEventListener("focusout",e=>{if(e.target.id==="aNome")setTimeout(()=>{if(document.activeElement&&document.activeElement.closest&&document.activeElement.closest(".sugg"))return;if(ui.sugg){ui.sugg=false;render()}},150)});
document.addEventListener("submit",e=>{e.preventDefault();const f=e.target;const r=route();
  if(f.id==="fLogin"){const em=$("#lEmail").value.trim(),pw=$("#lSenha").value;const btn=f.querySelector("[type=submit]");btn.disabled=true;
    const A=firebase.auth();(authModo==="criar"?A.createUserWithEmailAndPassword(em,pw):A.signInWithEmailAndPassword(em,pw))
      .then(()=>{authMsg=""}).catch(err=>{authMsg=traduz(err);btn.disabled=false;render();setTimeout(()=>{const x=$("#lEmail");if(x){x.value=em}},0)});return}
  if(f.id==="fNova"){const nome=$("#nNome").value.trim()||("Compra de "+toDate($("#nData").value).toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}));
    const id=uid();S.write("compras",id,"set",{nome,data:$("#nData").value||hoje(),criado:Date.now()});ui.newOpen=false;location.hash="planejar-"+id}
  else if(f.id==="fAdd"&&r.id){const nome=ui.aNome.trim().replace(/\s+/g," ");if(!nome)return;
    addItem(r.id,nome,ui.aQtd,ui.aDept);ui.aNome="";ui.aQtd=1;ui.sugg=false;render();setTimeout(()=>{const n=$("#aNome");n&&n.focus()},30)}
});
</script>

</body>
</html>
